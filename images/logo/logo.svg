<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1050 220" width="100%" height="100%">
  <defs>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00A8F0"/>
      <stop offset="100%" stop-color="#0072CE"/>
    </linearGradient>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0054A6"/>
      <stop offset="100%" stop-color="#002D62"/>
    </linearGradient>
  </defs>

  <!-- 1. Left Delivery Executive with Trolley and Boxes -->
  <g transform="translate(10, 15)">
    <!-- Delivery Cap & Head -->
    <circle cx="45" cy="22" r="12" fill="#0072CE"/>
    <path d="M 33 20 Q 52 14 62 20 L 62 25 L 33 25 Z" fill="#0054A6"/>
    <!-- Shirt -->
    <path d="M 28 35 L 62 35 L 58 90 L 32 90 Z" fill="#0072CE"/>
    <!-- Trousers -->
    <path d="M 32 90 L 44 90 L 42 145 L 30 145 Z" fill="#1E293B"/>
    <path d="M 46 90 L 58 90 L 58 145 L 46 145 Z" fill="#1E293B"/>
    <!-- Shoes -->
    <ellipse cx="36" cy="148" rx="8" ry="4" fill="#000"/>
    <ellipse cx="52" cy="148" rx="8" ry="4" fill="#000"/>
    
    <!-- Trolley Frame -->
    <path d="M 52 75 L 88 75 L 96 148 L 42 148 Z" fill="none" stroke="#DC2626" stroke-width="4"/>
    <line x1="88" y1="75" x2="88" y2="40" stroke="#DC2626" stroke-width="4"/>
    <!-- Trolley Wheels -->
    <circle cx="48" cy="150" r="10" fill="#DC2626"/>
    <circle cx="48" cy="150" r="4" fill="#FFF"/>
    <circle cx="92" cy="150" r="10" fill="#DC2626"/>
    <circle cx="92" cy="150" r="4" fill="#FFF"/>

    <!-- Stacked ESE Boxes -->
    <!-- Box 1 Top -->
    <rect x="56" y="60" width="34" height="28" fill="#D97706" rx="2" stroke="#B45309" stroke-width="1.5"/>
    <line x1="56" y1="74" x2="90" y2="74" stroke="#B45309" stroke-width="2"/>
    <text x="73" y="78" font-family="'Arial Black', sans-serif" font-size="8" font-weight="900" fill="#78350F" text-anchor="middle">ESE</text>

    <!-- Box 2 Middle -->
    <rect x="52" y="88" width="40" height="30" fill="#D97706" rx="2" stroke="#B45309" stroke-width="1.5"/>
    <line x1="52" y1="103" x2="92" y2="103" stroke="#B45309" stroke-width="2"/>
    <text x="72" y="107" font-family="'Arial Black', sans-serif" font-size="9" font-weight="900" fill="#78350F" text-anchor="middle">ESE</text>

    <!-- Box 3 Bottom -->
    <rect x="48" y="118" width="44" height="28" fill="#D97706" rx="2" stroke="#B45309" stroke-width="1.5"/>
    <line x1="48" y1="132" x2="92" y2="132" stroke="#B45309" stroke-width="2"/>
    <text x="70" y="136" font-family="'Arial Black', sans-serif" font-size="9" font-weight="900" fill="#78350F" text-anchor="middle">ESE</text>
  </g>

  <!-- 2. ESE Bold Block Mark -->
  <g transform="translate(145, 25)">
    <!-- E S E Bold Stylized Block Monogram -->
    <rect x="0" y="0" width="135" height="105" fill="url(#cyanGrad)" rx="6"/>
    <!-- Cutout shape inside ESE -->
    <text x="67" y="76" font-family="'Arial Black', 'Impact', sans-serif" font-size="68" font-weight="900" fill="#FFFFFF" text-anchor="middle" letter-spacing="-3">ESE</text>
    <path d="M 15 90 Q 67 102 120 90" stroke="#003B73" stroke-width="7" fill="none"/>
  </g>

  <!-- 3. Central Brand Typography: SECURE EXPRESS -->
  <g transform="translate(298, 18)">
    <!-- SECURE (Cyan Italic Bold) -->
    <text x="0" y="52" font-family="'Arial Black', 'Trebuchet MS', sans-serif" font-size="54" font-weight="900" font-style="italic" fill="url(#cyanGrad)" letter-spacing="1">SECURE</text>

    <!-- Registered Trademark R Symbol -->
    <circle cx="248" cy="18" r="9" fill="none" stroke="#0072CE" stroke-width="2"/>
    <text x="248" y="22" font-family="sans-serif" font-size="11" font-weight="bold" fill="#0072CE" text-anchor="middle">R</text>

    <!-- Wing Flourish Graphic extending right -->
    <path d="M 242 38 Q 450 35 525 70 Q 420 58 242 50 Z" fill="url(#cyanGrad)"/>

    <!-- EXPRESS (Cyan Italic Bold) -->
    <text x="45" y="105" font-family="'Arial Black', 'Trebuchet MS', sans-serif" font-size="54" font-weight="900" font-style="italic" fill="url(#cyanGrad)" letter-spacing="2">EXPRESS</text>

    <!-- Slogan: SECURE & BE ASSURED -->
    <text x="0" y="142" font-family="'Calibri', 'Segoe UI', sans-serif" font-size="22" font-weight="900" fill="#003366" letter-spacing="12">SECURE &amp; BE ASSURED</text>

    <!-- Full Legal Company Title: SECURE EXPRESS INDIA PVT LTD -->
    <text x="0" y="184" font-family="'Arial', 'Segoe UI', sans-serif" font-size="31" font-weight="900" fill="#002D62" letter-spacing="1.5">SECURE EXPRESS INDIA PVT LTD</text>
  </g>

  <!-- 4. Lord Ganesha Auspicious Icon Line Art -->
  <g transform="translate(825, 12)" stroke="#003366" stroke-width="1.8" fill="none">
    <!-- Crown / Mukut -->
    <path d="M 20 15 L 35 5 L 50 15 L 42 28 L 28 28 Z"/>
    <circle cx="35" cy="12" r="3" fill="#003366"/>
    <!-- Head & Ears -->
    <path d="M 15 32 Q 5 45 15 55 Q 25 55 25 42"/>
    <path d="M 55 32 Q 65 45 55 55 Q 45 55 45 42"/>
    <!-- Trunk (Modak / Trunk Curve) -->
    <path d="M 35 32 Q 35 60 20 65 Q 12 68 25 72 Q 40 70 38 52"/>
    <!-- Tusk & Eyes -->
    <circle cx="28" cy="36" r="1.5" fill="#003366"/>
    <circle cx="42" cy="36" r="1.5" fill="#003366"/>
    <!-- Modak -->
    <circle cx="18" cy="70" r="3" fill="#003366"/>
  </g>

  <!-- 5. Right Aeroplane Graphic -->
  <g transform="translate(860, 20)">
    <!-- Plane Body -->
    <path d="M 0 65 L 115 18 Q 145 8 155 24 Q 150 40 120 54 L 80 74 L 20 100 Q 5 105 0 95 Z" fill="url(#cyanGrad)"/>
    <!-- Tail Wing -->
    <path d="M 10 70 L -25 35 L -5 30 L 25 58 Z" fill="#0054A6"/>
    <!-- Main Wing -->
    <path d="M 45 60 L 20 115 L 45 110 L 80 65 Z" fill="#002D62"/>
    <!-- ESE Text on plane tail -->
    <text x="0" y="50" font-family="'Arial Black', sans-serif" font-size="12" fill="#FFF" transform="rotate(-15)">ESE</text>
  </g>
</svg>
